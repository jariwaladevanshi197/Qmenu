<!DOCTYPE html>
<html lang="en">
  <head>
    <title>QR Scanner | Q-MENU</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <!-- plugin styles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/bootstrap-datepicker.min.css" />
    <link rel="stylesheet" href="assets/css/bootstrap-select.min.css" />
    <link rel="stylesheet" href="assets/css/animate.min.css" />
    <link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
    <link rel="stylesheet" href="assets/css/magnific-popup.css" />
    <link rel="stylesheet" href="assets/css/jquery.bxslider.min.css" />
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css" />
    <link rel="stylesheet" href="assets/css/owl.theme.default.min.css" />
    <link rel="stylesheet" href="assets/css/swiper.min.css" />
    <link rel="stylesheet" href="assets/css/oapee-icons.css" />
    <!-- template styles -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    
  </head>

  <body>
    <div class="preloader">
      <img src="assets/images/loading.png" class="preloader__image" alt="" />
    </div>
    <!-- /.preloader -->

    <div class="page-wrapper">
      <header class="site-header-one stricky site-header-one__fixed-top">
        <div class="container-fluid">
          <div class="site-header-one__logo py-3">
            <a href="index.html" class="">
              <img
                src="assets/images/logo.png"
                class="mb-1"
                width="150"
                alt=""
              />
            </a>
            <span
              class="side-menu__toggler"
              onclick="location.href='../index.html'"
              ><i class="fa fa-home"></i
            ></span>
            <!-- /.side-menu__toggler -->
          </div>
          <!-- /.site-header-one__logo -->
          <div class="main-nav__main-navigation one-page-scroll-menu ml-auto">
            <ul class="main-nav__navigation-box">
              <a
                href="../index.html"
                class="thm-btn banner-one__btn .qrcode"
                style="margin-top: 8px; margin-bottom: 8px; margin-left: 60px"
                ><span>Home</span></a
              >
            </ul>
            <!-- /.main-nav__navigation-box -->
          </div>
          <!-- /.main-nav__main-navigation -->
        </div>
        <!-- /.container-fluid -->
      </header>
      <!-- /.site-header-one -->

      <section
        class="banner-one"
        id="home"
        style="padding-top: 100px; padding-bottom: 120px"
      >
        <img
          src="assets/images/shapes/banner-shape-1-1.png"
          class="banner-one__bg-shape-1"
          alt=""
        />
        <img
          src="assets/images/shapes/banner-shape-1-2.png"
          class="banner-one__bg-shape-2"
          alt=""
        />
        <img
          src="assets/images/shapes/banner-shape-1-3.png"
          class="banner-one__bg-shape-3"
          alt=""
        />
        <img
          src="assets/images/shapes/banner-shape-1-4.png"
          class="banner-one__bg-shape-4"
          alt=""
        />
        <img
          src="assets/images/shapes/banner-shape-1-5.png"
          class="banner-one__bg-shape-5"
          alt=""
        />

        <div class="container">
          <div
            class="d-flex flex-column justify-content-center align-items-center"
          >
            <div id="container">
              <div
                class="d-flex flex-column justify-content-center align-items-center"
              >
                <div class="banner-one__content text-center">
                  <h4>QR CODE <span style="color: #ff864c">SCANNER</span></h4>
                </div>

                <div>
                  <a id="btn-scan-qr">
                    <img
                      class="pt-2"
                      src="./assets/images/qr-logo.png"
                      width="100%"
                      height="80%"
                    />
                  </a>
                </div>

                <canvas class="mt-5" hidden="" id="qr-canvas"></canvas>

                <div id="qr-result" hidden="" style="display: none">
                  <b>Data:</b> <span id="outputData"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- /.container -->
      </section>
      <!-- /.banner-one -->

      <footer class="site-footer">
        <div class="site-footer__bottom">
          <div class="container">
            <div class="inner-container">
              <p>© copyright 2020 by surat.best</p>
              <div class="footer-social">
                <a href="https://www.facebook.com/surat.best4"
                  ><i class="fab fa-facebook-square"></i
                ></a>
                <a href="https://www.instagram.com/surat.best/"
                  ><i class="fab fa-instagram"></i
                ></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="/restro/admin/"
                  ><i class="fa fa-user"></i
                ></a>
              </div>
              <!-- /.footer-social -->
            </div>
            <!-- /.inner-container -->
          </div>
          <!-- /.container -->
        </div>
        <!-- /.site-footer__bottom -->
      </footer>
      <!-- /.site-footer -->
    </div>
    <!-- /.page-wrapper -->

    <a href="#" data-target="html" class="scroll-to-target scroll-to-top"
      ><i class="fa fa-angle-up"></i
    ></a>

    <!-- Plugin scripts -->
    <script src="assets/js/jquery-3.5.0.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/bootstrap-datepicker.min.js"></script>
    <script src="assets/js/bootstrap-select.min.js"></script>
    <script src="assets/js/isotope.js"></script>
    <script src="assets/js/jquery.ajaxchimp.min.js"></script>
    <script src="assets/js/jquery.bxslider.min.js"></script>
    <script src="assets/js/jquery.counterup.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/jquery.validate.min.js"></script>
    <script src="assets/js/jquery.waypoints.min.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/swiper.min.js"></script>
    <script src="assets/js/jquery.easing.min.js"></script>
    <script src="assets/js/TweenMax.min.js"></script>
    <script src="assets/js/wow.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="https://rawgit.com/sitepoint-editors/jsqrcode/master/src/qr_packed.js"></script>
    <script src="assets/qrsrc/js/qrCodeReader.js"></script>
  </body>
</html>
